name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    name: Laravel quality gate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clean_auth_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clean_auth_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, intl, curl, zip, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PostgreSQL migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: clean_auth_ci
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          SESSION_DRIVER: database
          SESSION_SECURE_COOKIE: false
          SESSION_ENCRYPT: false
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan migrate:status

      - name: Smoke auth use cases on PostgreSQL
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: clean_auth_ci
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          SESSION_DRIVER: database
          SESSION_SECURE_COOKIE: false
          SESSION_ENCRYPT: false
        run: |
          php artisan tinker --execute='$email="ci-smoke-".str_replace(".", "", uniqid("", true))."@example.com"; $password="Str0ng!Pass#2026"; app(\App\Application\Auth\UseCases\RegisterUserUseCase::class)->execute(new \App\Application\Auth\Commands\RegisterUserCommand("CI Smoke", $email, $password)); $login = app(\App\Application\Auth\UseCases\LoginUserUseCase::class)->execute(new \App\Application\Auth\Commands\LoginUserCommand($email, $password)); \App\Infrastructure\Auth\Models\UserEloquentModel::where("email", $email)->delete(); if (strlen($login->sessionToken) !== 64) { throw new RuntimeException("Invalid session token length"); } echo "POSTGRES_SMOKE_OK".PHP_EOL;'

      - name: Run tests
        run: php artisan test

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --level=8 app tests

      - name: Validate operation scripts
        run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh
